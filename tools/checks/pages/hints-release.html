<!doctype html>
<title>start</title>
<style>body{margin:0} button{position:absolute;left:20px;top:20px;width:160px;height:30px} #ov{position:absolute;left:0;top:0;width:300px;height:100px;background:rgba(0,0,0,.01);display:none}</style>
<button id=a>target button</button>
<div id=ov></div>
<script>
let events = [];
function log(s) { events.push(s); document.title = events.join(","); }
for (const t of ["pointerdown","mousedown","pointerup","mouseup","click"]) {
  a.addEventListener(t, e => log("a " + t));
  ov.addEventListener(t, e => log("ov " + t + ":" + e.isTrusted));
}
new MutationObserver(records => {
  for (const r of records) for (const n of r.addedNodes) if (n.localName === "ladybirdhints") log("host seen");
  for (const r of records) for (const n of r.removedNodes) if (n.localName === "ladybirdhints") { log("host removed"); ov.style.display = "block"; }
}).observe(document.documentElement, { childList: true });
</script>
