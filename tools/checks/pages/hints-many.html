<!doctype html>
<title>many</title>
<style>
  body { margin: 0; display: grid; grid-template-columns: repeat(40, 20px); grid-auto-rows: 20px; font: 9px sans-serif; }
  a { display: block; overflow: hidden; color: black; text-decoration: none; }
</style>
<body>
<script>
  for (let i = 0; i < 1180; ++i) {
    const link = document.createElement("a");
    link.href = "#" + i;
    link.textContent = i;
    document.body.appendChild(link);
  }
</script>
