<!doctype html>
<html><head><meta charset="utf-8"><title>page=hints</title>
<style>
html, body { margin: 0; }
#l { position: absolute; left: 10px; top: 10px; }
#b { position: absolute; left: 10px; top: 60px; width: 100px; height: 30px; }
#i { position: absolute; left: 10px; top: 110px; width: 300px; height: 30px; }
#c { position: absolute; left: 10px; top: 160px; width: 20px; height: 20px; }
</style>
<script src="/live.js"></script></head>
<body>
<a id="l" href="second.html">second</a>
<button id="b">Press</button>
<input id="i">
<input id="c" type="checkbox">
<script>
live.page = 'hints';
live.clicked = 'none'; live.trusted = 'none';
document.getElementById('b').addEventListener('click', function (e) {
  live.clicked = 'b'; live.trusted = e.isTrusted;
});
function update() {
  var a = document.activeElement;
  live.focus = a && a.id ? a.id : 'none';
  live.value = document.getElementById('i').value;
  live.checked = document.getElementById('c').checked;
}
</script>
</body></html>
